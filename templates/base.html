{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        CorpPortal
      {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body class="site-shell">
    <a class="skip-link" href="#main-content">Перейти к содержимому</a>
    <header class="site-header">
      <div class="container site-header__inner">
        <div class="site-brand">
          <a class="logo" href="{% url 'home' %}">CorpPortal</a>
          <p class="logo-subtitle">Новости, акции и внутренняя база знаний</p>
        </div>
        <button
          class="nav-toggle"
          type="button"
          aria-controls="primary-navigation"
          aria-expanded="false"
          aria-label="Открыть меню"
          data-nav-toggle
        >
          <span class="nav-toggle__line"></span>
          <span class="nav-toggle__line"></span>
          <span class="nav-toggle__line"></span>
        </button>
        <nav class="nav" id="primary-navigation" aria-label="Основная навигация" data-nav-drawer>
          <div class="nav__drawer-header">
            <span>Меню</span>
            <button class="nav__close" type="button" aria-label="Закрыть меню" data-nav-close>&times;</button>
          </div>
          <a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} class="is-active" aria-current="page"{% endif %}>Главная</a>
          <a href="{% url 'news_list' %}"{% if request.resolver_match.url_name == 'news_list' or request.resolver_match.url_name == 'news_detail' %} class="is-active" aria-current="page"{% endif %}>Новости</a>
          <a href="{% url 'promotion_list' %}"{% if request.resolver_match.url_name == 'promotion_list' or request.resolver_match.url_name == 'promotion_detail' %} class="is-active" aria-current="page"{% endif %}>Акции</a>
          <a href="{% url 'learning_list' %}"{% if request.resolver_match.url_name == 'learning_list' or request.resolver_match.url_name == 'learning_detail' or request.resolver_match.url_name == 'learning_compare' or request.resolver_match.url_name == 'learning_quiz_detail' %} class="is-active" aria-current="page"{% endif %}>База знаний</a>
        </nav>
      </div>
    </header>
    <button class="nav-backdrop" type="button" aria-label="Закрыть меню" data-nav-backdrop></button>

    <main class="site-main" id="main-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <p>Внутренний корпоративный портал</p>
      </div>
    </footer>
    <script src="{% static 'js/site-slider.js' %}"></script>
    <script src="{% static 'js/mobile-filters.js' %}"></script>
    <script src="{% static 'js/mobile-navigation.js' %}"></script>
  </body>
</html>
